<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e293b">
<title>Plan d’implantation praticables</title>
<link rel="icon" href="lavicon.jpg">
<link rel="apple-touch-icon" href="lavicon.jpg">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none; /* évite le zoom texte au double-tap */
  }

  :root {
    --bg: #dfe5ec;
    --card: #f8fafc;
    --text: #1f2937;
    --border: #c7d0db;
    --accent: #5b4bdb;
    --accent2: #7b6cff;
    --green: #2ca36b;
    --orange: #ff8b3d;
    --danger: #d64545;
    --module: #cbd5e1;
    --moduleRiser: #a5b4d4;
    --shadow: 0 8px 20px rgba(0,0,0,0.08);
    --card-radius: 24px;
  }

  .dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --border: #334155;
    --module: #475569;
    --moduleRiser: #5b6e9e;
    --shadow: 0 8px 20px rgba(0,0,0,0.5);
  }

  body {
    margin: 0;
    padding: 12px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
    touch-action: pan-y; /* bloque le scroll horizontal + évite le pan X */
  }

  /* suppression de tout effet "zoom tactile" sur les éléments cliquables */
  button, input, select, .cell, .planBlock {
    touch-action: manipulation;
  }

  .mainTitle {
    text-align: center;
    margin-bottom: 16px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(0px);
  }

  .mainTitle h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.3px;
    word-break: break-word;
  }

  .mainTitle p {
    margin: 6px 0 0;
    font-size: 14px;
    opacity: 0.7;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }

  .topInputs {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .topInputs input {
    width: 100%;
    padding: 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    font-size: 16px;
    background: var(--card);
    color: var(--text);
    transition: 0.1s;
  }

  .topBtns {
    display: flex;
    gap: 10px;
  }

  .topBtns button {
    flex: 1;
    margin: 0;
  }

  button {
    border: none;
    border-radius: 40px;
    padding: 14px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: 0.1s ease;
    color: white;
    background: #475569;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    touch-action: manipulation;
  }

  button:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .green { background: var(--green); }
  .orange { background: var(--orange); }
  .red { background: var(--danger); }
  .darkBtn { background: #1e293b; box-shadow: none; }

  .module {
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(2px);
  }

  .inputs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .inputs input, .inputs select {
    padding: 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 16px;
    background: var(--card);
    color: var(--text);
  }

  .grid {
    display: grid;
    gap: 6px;
    margin: 16px 0;
    justify-content: flex-start;
  }

  .cell {
    width: 64px;
    height: 32px;
    background: linear-gradient(145deg, var(--module), #94a3b8);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #0f172a;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: relative;
    transition: 0.05s linear;
  }
  .dark .cell { color: white; text-shadow: 0 1px 1px black; }
  .cell.riser { background: linear-gradient(145deg, var(--moduleRiser), #8b9dc3); }

  .r {
    position: absolute;
    left: 4px;
    bottom: 2px;
    font-size: 9px;
    font-weight: 800;
    color: #ff4d4d;
    background: rgba(0,0,0,0.3);
    padding: 0px 3px;
    border-radius: 20px;
  }

  .planGlobal {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: flex-start;
    align-items: flex-start;
    margin-top: 16px;
  }

  .planBlock {
    padding: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    transition: transform 0.1s;
    transform-origin: top left;
  }

  .moduleResume {
    background: rgba(0,0,0,0.04);
    border-radius: 20px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.5;
    margin: 12px 0;
  }

  .legend {
    margin: 12px 0;
    font-size: 11px;
    opacity: 0.7;
    text-align: center;
  }

  .commande {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid var(--border);
  }

  .big {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.5;
  }

  .small {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 6px;
  }

  .exportBtns {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
  }

  @media (max-width: 550px) {
    .cell {
      width: 52px;
      height: 28px;
      font-size: 11px;
    }
    .planBlock {
      transform-origin: top left;
    }
    .big {
      font-size: 18px;
    }
  }

  /* suppression du bug scroll X */
  body, html { overflow-x: hidden; }
  .planGlobal { max-width: 100%; }
  img, canvas { max-width: 100%; }
</style>
</head>
<body>

<div class="mainTitle">
  <h1 id="artistDisplay">—</h1>
  <p id="dateDisplay"></p>
</div>

<div class="card">
  <div class="topInputs">
    <input id="artistInput" placeholder="Artiste / Groupe">
    <input id="dateInput" type="date">
    <div class="topBtns">
      <button class="primary" onclick="lockHeader()">✓ Valider</button>
      <button class="orange" onclick="unlockHeader()">✎ Modifier</button>
      <button class="darkBtn" onclick="toggleTheme()">🌙 Nuit</button>
    </div>
  </div>
</div>

<div class="card">
  <button class="primary" onclick="addModule()">+ Ajouter module</button>
  <button class="red" onclick="resetAll()">⟳ Reset général</button>
</div>

<div id="modules"></div>

<div class="card" id="exportArea">
  <div class="exportHeader" style="text-align:center;">
    <h2 style="margin:0 0 6px;">PLAN D’IMPLANTATION PRATICABLES</h2>
    <h1 id="exportArtist" style="margin:4px 0;">—</h1>
    <p id="exportDate" style="margin:0;"></p>
  </div>
  <div id="resumeModules" class="moduleResume"></div>
  <div id="planGlobal" class="planGlobal"></div>
  <div class="legend">🔴 R → Riser • Chiffre → Hauteur (cm)</div>
  <div class="commande">
    <h2>📦 COMMANDE MATÉRIEL</h2>
    <div id="totaux" class="big"></div>
    <div id="sucres" class="small"></div>
  </div>
  <div class="exportBtns">
    <button class="green" onclick="exportPNG()">📸 Exporter la commande (PNG)</button>
    <button class="primary" onclick="copyCommande()">📋 Copier la commande</button>
    <button class="orange" onclick="shareCommande()">📤 Envoyer la commande</button>
  </div>
</div>

<script>
  let modules = [];
  let modulesContainer, artistInput, dateInput, artistDisplay, dateDisplay, exportArtist, exportDate, resumeModules, totaux, sucres, planGlobal;

  function save() {
    localStorage.setItem("modules", JSON.stringify(modules));
    localStorage.setItem("artist", artistInput.value);
    localStorage.setItem("date", dateInput.value);
    localStorage.setItem("theme", document.body.classList.contains("dark"));
  }

  function load() {
    let savedModules = localStorage.getItem("modules");
    modules = savedModules ? JSON.parse(savedModules) : [];
    artistInput.value = localStorage.getItem("artist") || "";
    dateInput.value = localStorage.getItem("date") || "";
    if (localStorage.getItem("theme") === "true") document.body.classList.add("dark");
    render();
  }

  function toggleTheme() {
    document.body.classList.toggle("dark");
    save();
    render(); // rafraîchit couleurs
  }

  function lockHeader() {
    save();
    render();
    artistInput.blur();
    dateInput.blur();
  }

  function unlockHeader() {
    artistInput.focus();
  }

  function addModule() {
    if (modules.some(m => !m.validated)) {
      alert("Veuillez valider ou supprimer le module en cours d'édition");
      return;
    }
    modules.unshift({ A: "", B: "", H: "", R: false, validated: false });
    render();
  }

  function calc(m) {
    let cols = Math.ceil((parseFloat(m.A) || 0) / 2);
    let rows = Math.ceil((parseFloat(m.B) || 0));
    if (cols < 1) cols = 1;
    if (rows < 1) rows = 1;
    let praticables = cols * rows;
    let risers = m.R ? praticables : 0;
    let sucres = ((cols - 1) * rows + cols * (rows - 1)) * 2;
    return { cols, rows, praticables, risers, sucres };
  }

  function validateModule(i) {
    let m = modules[i];
    if (!m.A || !m.B || !m.H || parseFloat(m.A) <= 0 || parseFloat(m.B) <= 0 || parseFloat(m.H) <= 0) {
      alert("Remplissez A, B et Hauteur avec des valeurs > 0");
      return;
    }
    modules[i].validated = true;
    save();
    render();
  }

  function removeModule(i) {
    modules.splice(i, 1);
    save();
    render();
  }

  function update(i, key, val) {
    modules[i][key] = (key === "R") ? val : val;
    render();
  }

  function drawGlobalPlan() {
    planGlobal.innerHTML = "";
    modules.forEach(m => {
      if (!m.validated) return;
      let c = calc(m);
      let totalCells = c.cols * c.rows;
      let scale = 1;
      if (totalCells > 30) scale = 0.7;
      else if (totalCells > 20) scale = 0.8;
      else if (totalCells > 12) scale = 0.9;

      let block = document.createElement("div");
      block.className = "planBlock";
      block.style.transform = `scale(${scale})`;
      let grid = document.createElement("div");
      grid.className = "grid";
      grid.style.gridTemplateColumns = `repeat(${c.cols}, 64px)`;
      for (let i = 0; i < c.cols * c.rows; i++) {
        let cell = document.createElement("div");
        cell.className = `cell ${m.R ? "riser" : ""}`;
        cell.innerText = m.H;
        if (m.R) {
          let rBadge = document.createElement("div");
          rBadge.className = "r";
          rBadge.innerText = "R";
          cell.appendChild(rBadge);
        }
        grid.appendChild(cell);
      }
      block.appendChild(grid);
      planGlobal.appendChild(block);
    });
    // ajustement responsive des cellules dans le plan global
    if (window.innerWidth < 550) {
      document.querySelectorAll('.planBlock .grid').forEach(g => {
        let cols = getComputedStyle(g).gridTemplateColumns.split(" ").length;
        if (cols) g.style.gridTemplateColumns = `repeat(${cols}, 52px)`;
      });
    } else {
      document.querySelectorAll('.planBlock .grid').forEach(g => {
        let cols = getComputedStyle(g).gridTemplateColumns.split(" ").length;
        if (cols) g.style.gridTemplateColumns = `repeat(${cols}, 64px)`;
      });
    }
  }

  function render() {
    artistDisplay.innerText = artistInput.value || "—";
    dateDisplay.innerText = dateInput.value ? new Date(dateInput.value).toLocaleDateString("fr-FR") : "";
    exportArtist.innerText = artistInput.value || "—";
    exportDate.innerText = dateDisplay.innerText;

    let html = "";
    let totalP = 0, totalR = 0, totalS = 0;
    let validatedModules = [];

    modules.forEach((m, idx) => {
      let c = calc(m);
      if (m.validated) {
        validatedModules.push(m);
        totalP += c.praticables;
        totalR += c.risers;
        totalS += c.sucres;
      }

      if (!m.validated) {
        html += `<div class="module">
          <h3>📌 Nouveau module</h3>
          <div class="inputs">
            <input placeholder="Dimension A (mètres)" value="${m.A}" onchange="update(${idx},'A',this.value)">
            <input placeholder="Dimension B (mètres)" value="${m.B}" onchange="update(${idx},'B',this.value)">
            <input placeholder="Hauteur (cm)" value="${m.H}" onchange="update(${idx},'H',this.value)">
            <select onchange="update(${idx},'R',this.value==='true')">
              <option value="false" ${!m.R ? "selected" : ""}>Sans Riser</option>
              <option value="true" ${m.R ? "selected" : ""}>Avec Riser</option>
            </select>
          </div>
          <div class="grid" style="grid-template-columns: repeat(${Math.max(c.cols,1)}, 64px)">
            ${Array(Math.max(c.cols * c.rows, 1)).fill(0).map(() => `<div class="cell ${m.R ? 'riser' : ''}">${m.H || "?"}${m.R ? '<div class="r">R</div>' : ''}</div>`).join("")}
          </div>
          <button class="primary" onclick="validateModule(${idx})">✓ VALIDER MODULE</button>
        </div>`;
      } else {
        html += `<div class="module">
          <h3>✅ ${m.A} × ${m.B} — ${m.H} cm ${m.R ? "• Riser •" : ""}</h3>
          <div>🧩 Praticables : ${c.praticables} &nbsp;|&nbsp; 🧱 Risers : ${c.risers}<br><span class="small">🔗 Sucres : ${c.sucres}</span></div>
          <div class="grid" style="grid-template-columns: repeat(${c.cols}, 64px)">
            ${Array(c.cols * c.rows).fill(0).map(() => `<div class="cell ${m.R ? 'riser' : ''}">${m.H}${m.R ? '<div class="r">R</div>' : ''}</div>`).join("")}
          </div>
          <button class="red" onclick="removeModule(${idx})">🗑 Supprimer ce module</button>
        </div>`;
      }
    });

    modulesContainer.innerHTML = html;

    resumeModules.innerHTML = `<b>${validatedModules.length} module${validatedModules.length > 1 ? "s" : ""} validé(s) :</b><br>` +
      validatedModules.map(m => `• ${m.A} × ${m.B} → ${m.H} cm ${m.R ? " [R]" : ""}`).join("<br>") || "Aucun module validé";

    totaux.innerHTML = `📐 Modules : ${validatedModules.length}<br>🟩 Praticables : ${totalP}<br>🟧 Risers : ${totalR}`;
    sucres.innerHTML = `🔸 Sucres (colliers) : ${totalS}`;

    drawGlobalPlan();
    save();
  }

  function exportPNG() {
    html2canvas(document.getElementById("exportArea"), { scale: 2, backgroundColor: null }).then(canvas => {
      let link = document.createElement("a");
      link.download = "plan-praticables.png";
      link.href = canvas.toDataURL();
      link.click();
    }).catch(err => alert("Erreur capture : " + err));
  }

  function copyCommande() {
    let txt = `${artistInput.value || "—"}\n${dateDisplay.innerText}\n\nPLAN D'IMPLANTATION\n${resumeModules.innerText}\n${totaux.innerText}\n${sucres.innerText}`;
    navigator.clipboard.writeText(txt);
    alert("✅ Commande copiée");
  }

  function shareCommande() {
    let txt = `${artistInput.value}\n${dateDisplay.innerText}\n${totaux.innerText}\n${sucres.innerText}`;
    if (navigator.share) navigator.share({ title: "Commande praticables", text: txt }).catch(() => alert("Partage annulé"));
    else alert("Partage non supporté sur ce navigateur");
  }

  function resetAll() {
    if (!confirm("⚠️ Tout effacer ? Modules, artiste, date… irrémédiable.")) return;
    modules = [];
    artistInput.value = "";
    dateInput.value = "";
    localStorage.clear();
    render();
  }

  window.onload = () => {
    modulesContainer = document.getElementById("modules");
    artistInput = document.getElementById("artistInput");
    dateInput = document.getElementById("dateInput");
    artistDisplay = document.getElementById("artistDisplay");
    dateDisplay = document.getElementById("dateDisplay");
    exportArtist = document.getElementById("exportArtist");
    exportDate = document.getElementById("exportDate");
    resumeModules = document.getElementById("resumeModules");
    totaux = document.getElementById("totaux");
    sucres = document.getElementById("sucres");
    planGlobal = document.getElementById("planGlobal");
    load();
  };
</script>
</body>
</html>
